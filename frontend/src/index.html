<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Domain Scout - Domain Analysis Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Runtime environment configuration - generated at container startup -->
  <script src="assets/env.js"></script>
  <!-- Suppress LockManager warning from Supabase -->
  <script>
    const originalWarn = console.warn;
    console.warn = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('LockManager')) return;
      originalWarn.apply(console, args);
    };
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
